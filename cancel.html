<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled - Wash N Roll</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--light-gray);
      text-align: center;
    }
    .cancel-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-width: 400px;
      width: 100%;
    }
    .cancel-card h1 {
      color: var(--navy);
      margin-bottom: 15px;
    }
    .cancel-card p {
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .icon {
      font-size: 60px;
      color: var(--red);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="cancel-card">
    <div class="icon">✕</div>
    <h1>Payment Cancelled</h1>
    <p>Your payment was cancelled. If you still want to book, please try again or contact us via WhatsApp.</p>
    <a href="/" class="btn btn-navy">Back to Home</a>
  </div>
</body>
</html>
