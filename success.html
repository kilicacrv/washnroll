<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Wash N Roll</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--light-gray);
      text-align: center;
    }
    .success-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      max-width: 400px;
      width: 100%;
    }
    .success-card h1 {
      color: var(--navy);
      margin-bottom: 15px;
    }
    .success-card p {
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .icon {
      font-size: 60px;
      color: #10b981;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="icon">✓</div>
    <h1>Payment Successful!</h1>
    <p>Thank you for choosing Wash N Roll. Your booking has been confirmed and payment received.</p>
    <a href="/" class="btn btn-navy">Back to Home</a>
  </div>
</body>
</html>
